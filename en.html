<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kenny Lee | Composer, Sound Designer</title>
    <!--
        en.html сохранён как точка входа для внешних ссылок и SEO.
        Реальный контент живёт в index.html, язык передаётся через ?lang=en
        (см. assets/js/i18n.js).
    -->
    <link rel="canonical" href="./index.html?lang=en">
    <meta http-equiv="refresh" content="0; url=./index.html?lang=en">
    <script>
        (function () {
            try { localStorage.setItem('yfro.lang', 'en'); } catch (_) {}
            window.location.replace('./index.html?lang=en');
        })();
    </script>
</head>
<body>
    <p>Loading English version… If nothing happens, <a href="./index.html?lang=en">click here</a>.</p>
</body>
</html>
